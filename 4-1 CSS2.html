<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    h2,h3,p{
        padding: 0;
        margin: 0;
    }/*群组选择器*/
    #box{
        padding:8px;
        margin:20px;
        border:1px solid #ccc;
        font-size: 12px;
        width: 480px;
    }
    #box  h3{
        font-size:16px;
        line-height:33px;
        text-align: center;
        color: #034;
        letter-spacing: 3px;
    }
    #box>p{
        color: #666;
        text-indent: 2em;
        line-height: 150%;
    }
    #box a{
        color:rgb(234, 15, 15);
        text-decoration: none;
    }

    /*新增样式*/
    /*h2整行黑底白字，居中，行高150%*/
    h2 {
        background-color: #000;
        color: #fff;
        padding: 4px;
        text-align: center;
        line-height: 150%;
    }
    /*学号、姓名、班级：蓝色加粗，单个选择器*/
    .student-info{
        color: blue;
        font-weight: bold;
    }
    /*知识点冒号后：蓝底白字*/
    .point{
        background-color: blue;
        color: white;
    }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
  <div id="box">
    <h3>CSS进阶</h3>
    <p>
        学号:<span class="student-info">24001010932</span>, 姓名：<span class="student-info">唐笑</span>, 班级:<span class="student-info">计算机24009</span>
        ,《高级网页设计》设计的学习难度:还可以，
        本实例的知识点:<span class="point">CSS群组选择器和后代选择器</span>。
       <a href="#">[更多]</a>
    </p>
  </div>
</body>
</html>
