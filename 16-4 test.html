<!DOCTYPE html>
<html lang="zh-CN">
<!--
姓名：唐笑
日期：2026-10-29
功能名称：点击排行 Tab 选项卡切换
说明：默认显示"24小时排行"（与原图一致）；
     点击"实时点击"切换并自动生成随机排行内容；
     再点"24小时排行"切回原列表。
素材：tit06.jpg(标题)  lin.jpg(选中选项卡底部指示条)  k.jpg(前三名序号底图)
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-4 点击排行选项卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            padding: 40px 0;
        }
        .tx_box {
            width: 345px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e5e5e5;
        }

        /* 标题（背景图 tit06.jpg 自带"点击排行"文字和图标） */
        .tx_tit {
            height: 42px;
            background: url(tit06.jpg) no-repeat 12px center;
            border-bottom: 1px solid #eee;
        }

        /* 选项卡 */
        .tx_tab { list-style: none; overflow: hidden; }
        .tx_tab li {
            float: left;
            width: 50%;
            height: 36px;
            line-height: 36px;
            text-align: center;
            font-size: 14px;
            background: #d9d9d9;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }
        .tx_tab li.active {
            background: #fff url(lin.jpg) no-repeat bottom center;
            background-size: 100% 100%;
            color: #ff6600;
            font-weight: bold;
        }

        /* 排行列表 */
        .tx_list { display: none; list-style: none; padding: 4px 14px 8px; }
        .tx_list.show { display: block; }
        .tx_list li {
            height: 31px;
            line-height: 31px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tx_list li:last-child { border-bottom: none; }
        .tx_list .tx_num {
            display: inline-block;
            width: 18px; height: 16px;
            line-height: 16px;
            text-align: center;
            font-size: 12px;
            color: #ff6600;
            margin-right: 10px;
            vertical-align: middle;
        }
        /* 前三名使用 k.jpg 橙框底图 */
        .tx_list li.tx_top .tx_num {
            background: url(k.jpg) no-repeat center;
            background-size: 100% 100%;
        }
        .tx_list .tx_cnt {
            float: right;
            color: #999;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="tx_box">
        <div class="tx_tit"></div>

        <ul class="tx_tab">
            <li data-type="real">实时点击</li>
            <li data-type="day" class="active">24小时排行</li>
        </ul>

        <!-- 实时点击面板（内容由 JS 自动补充） -->
        <ul class="tx_list" id="tx_list_real"></ul>

        <!-- 24小时排行面板（默认，与原图一致） -->
        <ul class="tx_list show" id="tx_list_day">
            <li class="tx_top"><span class="tx_cnt">356322</span><span class="tx_num">1</span>灯塔水母：地球上唯一不死生物</li>
            <li class="tx_top"><span class="tx_cnt">311246</span><span class="tx_num">2</span>阿里巴巴全资收购UC 俞永福梅开二度</li>
            <li class="tx_top"><span class="tx_cnt">295823</span><span class="tx_num">3</span>亚马逊惊现三米长白毛怪鱼用肺</li>
            <li><span class="tx_cnt">266061</span><span class="tx_num">4</span>奉化男子上山抓野味 遭遇极濒危猴</li>
            <li><span class="tx_cnt">243936</span><span class="tx_num">5</span>大白鲨深海失踪 或被大型生物猎杀</li>
            <li><span class="tx_cnt">224346</span><span class="tx_num">6</span>南非小犀牛目睹母亲被猎杀不肯离开</li>
            <li><span class="tx_cnt">172694</span><span class="tx_num">7</span>余额宝周岁：收益率"过山车"</li>
            <li><span class="tx_cnt">128789</span><span class="tx_num">8</span>"尸油入餐桌"纯属无稽之谈</li>
        </ul>
    </div>

    <script>
        const tx_tabs = document.querySelectorAll('.tx_tab li');
        const tx_real = document.getElementById('tx_list_real');
        const tx_day  = document.getElementById('tx_list_day');

        // 实时点击面板的标题素材池
        const tx_pool = [
            "神舟飞船返回舱成功着陆", "人工智能助力医疗诊断提速",
            "新能源汽车销量再创新高", "大学生创新创业大赛开幕",
            "国产大飞机完成商业首航", "5G网络覆盖全部县城",
            "深海探测器发现新物种", "量子计算机取得新突破",
            " summer 暑期档电影票房破纪录", "智慧农业让种地更轻松",
            "快递年业务量突破千亿件", "风能发电装机容量全球第一"
        ];

        // 生成随机排行数据并补充到"实时点击"面板
        function txFillReal() {
            // 打乱标题池，取前 8 条
            const arr = tx_pool.slice().sort(() => Math.random() - 0.5).slice(0, 8);
            let html = '';
            arr.forEach((t, i) => {
                const cnt = Math.floor(Math.random() * 300000 + 10000); // 随机点击量
                const top = i < 3 ? ' class="tx_top"' : '';
                html += `<li${top}><span class="tx_cnt">${cnt}</span><span class="tx_num">${i + 1}</span>${t}</li>`;
            });
            tx_real.innerHTML = html;
        }

        // 选项卡切换
        tx_tabs.forEach(li => {
            li.addEventListener('click', () => {
                tx_tabs.forEach(x => x.classList.remove('active'));
                li.classList.add('active');
                if (li.dataset.type === 'real') {
                    txFillReal();               // 每次点击实时补充新内容
                    tx_real.classList.add('show');
                    tx_day.classList.remove('show');
                } else {
                    tx_day.classList.add('show');
                    tx_real.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
