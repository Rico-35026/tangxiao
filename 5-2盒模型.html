<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型，框模型,box model</title>
    <style>
        body,u1,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding :0;
        }
        u1{
            list-style: none;
        }
        .a{
          width: 500px;
          height: 500px;
          border:2px dotted #039;
          padding: 70px 60px 50px 40px;
          margin: 40px auto;/*上下，左右margin为auto则盒子居中*/
        }
        /*盒子的高度：内容的高度+上下边框的高度+上下padding的高度+上下margin的高度*/
        .b{
          width: 500px;
          height: 500px;
          border:2px dashed rgb(236, 13, 217);
        margin: 50px auto 40px;/*上下，左右margin为auto则盒子居中*/
        }
        .c{
           width: 200px;
          height: 200px;
          border:2px solid rgb(21, 211, 236);
        margin: 50px auto 40px;/*上下，左右margin为auto则盒子居中*/
        }
    </style>
</head>
<body>
    <div class="a">932 唐笑</div>
    <div class="b">932 唐笑</div>
    <div class="c">932 唐笑</div>
</body>
</html>
