<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>唐笑：JavaScript</h2>
    <script>
        //输出，唐笑，你好，document,alert,console三种方式
        document.write("唐笑，你好");
        alert("唐笑，你好");
        console.log("唐笑，你好");
        //confirm和prompt
        confirm("确认吗？");
        prompt("请输入你的姓名：");
    </script>
</body>
</html>
