<!DOCTYPE html>
<html lang="zh-CN">
<!--
姓名：唐笑
日期：2026-11-02
功能名称：API 接口测试工具 —— 支持 GET/POST/PUT/DELETE，显示请求与响应
示例：https://jsonplaceholder.typicode.com/posts
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-4 API 测试工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; padding: 24px 16px; color: #e0e0e0;
        }
        .tx_container { max-width: 1100px; margin: 0 auto; }
        .tx_header {
            text-align: center; margin-bottom: 20px;
        }
        .tx_header h1 { font-size: 22px; color: #4fc3f7; margin-bottom: 4px; }
        .tx_header p { font-size: 12px; color: #888; }

        /* === 请求面板 === */
        .tx_panel {
            background: #1e1e2e; border-radius: 12px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .tx_panel-title {
            font-size: 14px; color: #4fc3f7; margin-bottom: 14px;
            padding-bottom: 8px; border-bottom: 1px solid #2d2d44;
        }
        .tx_row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }

        .tx_select {
            background: #2d2d44; color: #e0e0e0; border: 1px solid #3d3d5c;
            padding: 10px 14px; border-radius: 8px; font-size: 13px;
            cursor: pointer; font-weight: bold; min-width: 90px;
        }
        .tx_select.get    { color: #4caf50; }
        .tx_select.post   { color: #ff9800; }
        .tx_select.put    { color: #2196f3; }
        .tx_select.delete { color: #f44336; }

        .tx_input {
            flex: 1; min-width: 200px;
            background: #2d2d44; color: #e0e0e0; border: 1px solid #3d3d5c;
            padding: 10px 14px; border-radius: 8px; font-size: 13px;
            font-family: Consolas, Monaco, monospace;
        }
        .tx_input:focus, .tx_select:focus, .tx_textarea:focus {
            outline: none; border-color: #4fc3f7;
        }

        .tx_textarea {
            width: 100%; background: #2d2d44; color: #a6e3a1;
            border: 1px solid #3d3d5c; border-radius: 8px;
            padding: 12px 14px; font-size: 13px;
            font-family: Consolas, Monaco, monospace; resize: vertical;
            min-height: 100px; line-height: 1.6;
        }

        .tx_btn {
            border: none; padding: 10px 22px; border-radius: 8px;
            font-size: 14px; cursor: pointer; font-weight: bold;
            transition: all 0.2s;
        }
        .tx_send {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #000;
        }
        .tx_send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,195,247,0.4); }
        .tx_send:disabled { background: #555; cursor: not-allowed; color: #888; }
        .tx_clear { background: #3d3d5c; color: #ccc; }
        .tx_clear:hover { background: #4d4d6c; }

        /* === 快捷示例 === */
        .tx_examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tx_example-btn {
            background: #2d2d44; color: #4fc3f7; border: 1px dashed #4fc3f7;
            padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer;
            font-family: Consolas, Monaco, monospace;
        }
        .tx_example-btn:hover { background: #4fc3f7; color: #000; }

        /* === 状态条 === */
        .tx_status-bar {
            display: flex; gap: 14px; align-items: center;
            padding: 10px 14px; border-radius: 8px; margin-bottom: 12px;
            font-size: 13px; display: none; flex-wrap: wrap;
        }
        .tx_status-bar.loading { background: #1e3a5f; color: #4fc3f7; display: flex; }
        .tx_status-bar.success { background: #1a3a1a; color: #4caf50; display: flex; }
        .tx_status-bar.error   { background: #3a1a1a; color: #f44336; display: flex; }
        .tx_badge {
            padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: bold;
            background: rgba(255,255,255,0.1);
        }
        .tx_time { color: #aaa; font-family: Consolas, Monaco, monospace; }

        /* === 响应区 === */
        .tx_tabs {
            display: flex; gap: 4px; margin-bottom: 0;
            border-bottom: 1px solid #2d2d44;
        }
        .tx_tab {
            padding: 10px 18px; background: transparent;
            border: none; color: #888; cursor: pointer;
            font-size: 13px; border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tx_tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }
        .tx_tab-content { display: none; }
        .tx_tab-content.active { display: block; }

        .tx_resp-box {
            background: #0d1117; border-radius: 0 0 8px 8px;
            padding: 16px; font-family: Consolas, Monaco, monospace;
            font-size: 12px; line-height: 1.7; max-height: 420px;
            overflow: auto; white-space: pre-wrap; word-break: break-all;
            border: 1px solid #2d2d44; border-top: none;
        }
        .tx_resp-box.error-box { color: #f44336; }

        .tx_footer { text-align: center; font-size: 12px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="tx_container">
        <div class="tx_header">
            <h1>🛠️ API 接口测试工具</h1>
            <p>作者：唐笑 · fetch + GET / POST / PUT / DELETE · 支持跨域接口</p>
        </div>

        <!-- 请求面板 -->
        <div class="tx_panel">
            <div class="tx_panel-title">📡 构建请求</div>

            <!-- 快捷示例 -->
            <div class="tx_examples">
                <span style="font-size:11px;color:#888;margin-right:4px;">快捷示例：</span>
                <button class="tx_example-btn" onclick="tx_fillExample('get-posts')">GET posts</button>
                <button class="tx_example-btn" onclick="tx_fillExample('get-single')">GET post/1</button>
                <button class="tx_example-btn" onclick="tx_fillExample('post-create')">POST 新建</button>
                <button class="tx_example-btn" onclick="tx_fillExample('put-update')">PUT 更新</button>
                <button class="tx_example-btn" onclick="tx_fillExample('del')">DELETE 删除</button>
                <button class="tx_example-btn" onclick="tx_fillExample('dog')">狗狗图片</button>
                <button class="tx_example-btn" onclick="tx_fillExample('products')">商品列表</button>
            </div>

            <!-- URL 行 -->
            <div class="tx_row">
                <select class="tx_select" id="tx_method" onchange="tx_updateMethodColor()">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                </select>
                <input class="tx_input" id="tx_url" type="text" placeholder="https://jsonplaceholder.typicode.com/posts"
                       value="https://jsonplaceholder.typicode.com/posts">
                <button class="tx_btn tx_send" id="tx_sendBtn" onclick="tx_sendRequest()">▶ 发送</button>
                <button class="tx_btn tx_clear" onclick="tx_clearAll()">清空</button>
            </div>

            <!-- 请求体 -->
            <div id="tx_bodyArea" style="display:none;">
                <div style="font-size:12px;color:#888;margin-bottom:6px;">📝 请求体 (JSON)：</div>
                <textarea class="tx_textarea" id="tx_body" placeholder='{"title": "hello", "body": "world", "userId": 1}'></textarea>
            </div>
        </div>

        <!-- 状态 + 响应 -->
        <div class="tx_panel">
            <div class="tx_panel-title">📊 响应结果</div>
            <div class="tx_status-bar" id="tx_statusBar"></div>

            <!-- Tabs -->
            <div class="tx_tabs">
                <button class="tx_tab active" onclick="tx_switchTab(event, 'json')">JSON</button>
                <button class="tx_tab" onclick="tx_switchTab(event, 'headers')">响应头</button>
                <button class="tx_tab" onclick="tx_switchTab(event, 'request')">请求详情</button>
            </div>

            <div id="tx_json" class="tx_tab-content active">
                <div class="tx_resp-box" id="tx_respBox">（点击"发送"开始测试）</div>
            </div>
            <div id="tx_headers" class="tx_tab-content">
                <div class="tx_resp-box" id="tx_headersBox">—</div>
            </div>
            <div id="tx_request" class="tx_tab-content">
                <div class="tx_resp-box" id="tx_requestBox">—</div>
            </div>
        </div>

        <div class="tx_footer">17-4 · API 测试工具 · 唐笑 · 2026</div>
    </div>

    <script>
        let tx_lastReqInfo = {};

        function tx_updateMethodColor() {
            let sel = document.getElementById("tx_method");
            sel.className = "tx_select " + sel.value.toLowerCase();
            // 非 GET 请求显示 body
            document.getElementById("tx_bodyArea").style.display =
                (sel.value === "GET" || sel.value === "DELETE") ? "none" : "block";
        }
        tx_updateMethodColor();

        // ========== 快捷示例 ==========
        function tx_fillExample(key) {
            let tx_url = document.getElementById("tx_url");
            let tx_method = document.getElementById("tx_method");
            let tx_body = document.getElementById("tx_body");
            switch (key) {
                case "get-posts":
                    tx_method.value = "GET";
                    tx_url.value = "https://jsonplaceholder.typicode.com/posts?_limit=3";
                    tx_body.value = ""; break;
                case "get-single":
                    tx_method.value = "GET";
                    tx_url.value = "https://jsonplaceholder.typicode.com/posts/1";
                    tx_body.value = ""; break;
                case "post-create":
                    tx_method.value = "POST";
                    tx_url.value = "https://jsonplaceholder.typicode.com/posts";
                    tx_body.value = '{\n    "title": "唐笑的帖子",\n    "body": "这是用 POST 创建的内容",\n    "userId": 24001010932\n}';
                    break;
                case "put-update":
                    tx_method.value = "PUT";
                    tx_url.value = "https://jsonplaceholder.typicode.com/posts/1";
                    tx_body.value = '{\n    "id": 1,\n    "title": "更新后的标题",\n    "body": "PUT 请求会整体替换资源",\n    "userId": 1\n}';
                    break;
                case "del":
                    tx_method.value = "DELETE";
                    tx_url.value = "https://jsonplaceholder.typicode.com/posts/1";
                    tx_body.value = ""; break;
                case "dog":
                    tx_method.value = "GET";
                    tx_url.value = "https://dog.ceo/api/breed/hound/images/random/3";
                    tx_body.value = ""; break;
                case "products":
                    tx_method.value = "GET";
                    tx_url.value = "https://dummyjson.com/products?limit=5";
                    tx_body.value = ""; break;
            }
            tx_updateMethodColor();
        }

        // ========== 发送请求 ==========
        function tx_sendRequest() {
            let tx_method = document.getElementById("tx_method").value;
            let tx_url = document.getElementById("tx_url").value.trim();
            let tx_bodyRaw = document.getElementById("tx_body").value.trim();
            let tx_sendBtn = document.getElementById("tx_sendBtn");
            let tx_statusBar = document.getElementById("tx_statusBar");
            let tx_respBox = document.getElementById("tx_respBox");

            if (!tx_url) { alert("请填写接口地址"); return; }

            // 准备 fetch 参数
            let tx_options = { method: tx_method };
            let tx_bodyJson = null;
            if ((tx_method === "POST" || tx_method === "PUT" || tx_method === "PATCH") && tx_bodyRaw) {
                try {
                    tx_bodyJson = JSON.parse(tx_bodyRaw);
                } catch (e) {
                    tx_showError("JSON 格式错误：" + e.message);
                    return;
                }
                tx_options.headers = { "Content-Type": "application/json" };
                tx_options.body = JSON.stringify(tx_bodyJson);
            }

            // 记录请求详情
            tx_lastReqInfo = { method: tx_method, url: tx_url, options: tx_options };

            // UI 状态
            tx_sendBtn.disabled = true;
            tx_statusBar.className = "tx_status-bar loading";
            tx_statusBar.innerHTML = '<span>⏳ 请求中...</span>';
            tx_respBox.className = "tx_resp-box";
            tx_respBox.textContent = "请求中...";

            let tx_start = Date.now();

            fetch(tx_url, tx_options)
                .then(async function(res) {
                    let tx_cost = Date.now() - tx_start;
                    let tx_status = res.status;
                    let tx_ok = res.ok;

                    // 解析响应头
                    let tx_hdrs = {};
                    res.headers.forEach(function(v, k) { tx_hdrs[k] = v; });
                    document.getElementById("tx_headersBox").textContent =
                        Object.entries(tx_hdrs).map(([k, v]) => k + ": " + v).join("\n");

                    // 解析 body
                    let tx_text = await res.text();
                    let tx_parsed = null;
                    let tx_isJson = false;
                    try {
                        tx_parsed = JSON.parse(tx_text);
                        tx_isJson = true;
                    } catch (e) {
                        // 不是 JSON，原样显示
                    }

                    // 状态条
                    let tx_statusClass = tx_ok ? "success" : "error";
                    let tx_color = tx_ok ? "#4caf50" : "#f44336";
                    tx_statusBar.className = "tx_status-bar " + tx_statusClass;
                    tx_statusBar.innerHTML =
                        '<span class="tx_badge" style="background:' + tx_color + '22;color:' + tx_color + ';">HTTP ' + tx_status + '</span>' +
                        '<span class="tx_time">⏱ ' + tx_cost + ' ms</span>' +
                        '<span class="tx_time">📦 ' + (tx_text.length) + ' bytes</span>' +
                        '<span style="color:#888;">' + (tx_isJson ? 'application/json' : 'text/plain') + '</span>';

                    // 响应体
                    tx_respBox.className = "tx_resp-box";
                    tx_respBox.textContent = tx_isJson ? JSON.stringify(tx_parsed, null, 2) : tx_text;

                    // 请求详情
                    let tx_reqText = tx_method + " " + tx_url + "\n\nHeaders:\n";
                    tx_reqText += "  Content-Type: application/json\n\n";
                    if (tx_bodyJson) tx_reqText += "Body:\n" + JSON.stringify(tx_bodyJson, null, 2) + "\n\n";
                    document.getElementById("tx_requestBox").textContent = tx_reqText + "User-Agent: Mozilla (浏览器 fetch)\n";
                })
                .catch(function(err) {
                    let tx_cost = Date.now() - tx_start;
                    tx_showError("❌ 请求失败（" + tx_cost + " ms）：" + err.message +
                        "\n\n可能原因：\n1. 接口不存在或 URL 拼写错误\n2. 跨域被浏览器 CORS 策略拦截\n3. 网络断开\n4. 使用 file:// 协议打开（改用 http.server 预览）");
                    document.getElementById("tx_headersBox").textContent = "（无响应）";
                    document.getElementById("tx_requestBox").textContent =
                        tx_method + " " + tx_url + "\n\n请求未到达服务器或未收到响应";
                })
                .finally(function() {
                    tx_sendBtn.disabled = false;
                });
        }

        function tx_showError(msg) {
            let tx_statusBar = document.getElementById("tx_statusBar");
            let tx_respBox = document.getElementById("tx_respBox");
            tx_statusBar.className = "tx_status-bar error";
            tx_statusBar.innerHTML = '<span>❌ 错误</span>';
            tx_respBox.className = "tx_resp-box error-box";
            tx_respBox.textContent = msg;
        }

        function tx_clearAll() {
            document.getElementById("tx_url").value = "";
            document.getElementById("tx_body").value = "";
            document.getElementById("tx_respBox").textContent = "（点击『发送』开始测试）";
            document.getElementById("tx_headersBox").textContent = "—";
            document.getElementById("tx_requestBox").textContent = "—";
            document.getElementById("tx_statusBar").className = "tx_status-bar";
            document.getElementById("tx_statusBar").innerHTML = "";
        }

        function tx_switchTab(ev, name) {
            document.querySelectorAll(".tx_tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".tx_tab-content").forEach(c => c.classList.remove("active"));
            ev.target.classList.add("active");
            document.getElementById(name).classList.add("active");
        }

        // Ctrl+Enter 快捷发送
        document.addEventListener("keydown", function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                tx_sendRequest();
            }
        });
    </script>
</body>
</html>
