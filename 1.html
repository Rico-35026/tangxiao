<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>932 · 唐笑 · 大连东软信息学院</title>
    <style>
        :root{
            --cream:#f5edda;      /* 奶米底色 */
            --paper:#fcf7ea;      /* 纸张色 */
            --red:#b03a2e;        /* 复古红 */
            --red-deep:#8e2b22;
            --blue:#3d5a80;       /* 牛仔蓝 */
            --ink:#33455e;        /* 墨线色 */
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            padding:24px;
            background-color:var(--cream);
            background-image:
                radial-gradient(rgba(61,90,128,.08) 1.2px, transparent 1.3px),
                radial-gradient(rgba(176,58,46,.06) 1.2px, transparent 1.3px);
            background-size:26px 26px,26px 26px;
            background-position:0 0,13px 13px;
            font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Comic Sans MS",cursive;
            color:var(--ink);
            overflow-x:hidden;
        }
        /* ===== 手绘卡片 ===== */
        .card{
            position:relative;
            width:min(560px,100%);
            padding:58px 48px 88px;
            background:var(--paper);
            border:2.5px solid var(--ink);
            border-radius:255px 20px 225px 20px/20px 225px 20px 255px;
            box-shadow:7px 9px 0 rgba(61,90,128,.16);
            text-align:center;
        }
        .card::before{ /* 双层虚线内框 */
            content:"";
            position:absolute;inset:10px;
            border:1.6px dashed rgba(61,90,128,.5);
            border-radius:225px 18px 205px 18px/18px 205px 18px 225px;
            pointer-events:none;
        }
        /* 纸胶带 */
        .tape{
            position:absolute;top:-13px;width:92px;height:26px;
            background:rgba(61,90,128,.22);
            border-left:1px dashed rgba(61,90,128,.4);
            border-right:1px dashed rgba(61,90,128,.4);
        }
        .tape-l{left:54px;transform:rotate(-8deg);}
        .tape-r{right:54px;transform:rotate(7deg);}

        /* ===== 学校名 ===== */
        .school{
            display:flex;align-items:center;justify-content:center;gap:16px;
            font-size:26px;letter-spacing:9px;text-indent:9px;
            color:var(--blue);
        }
        .school i{
            width:44px;height:2.5px;background:var(--blue);
            border-radius:4px;opacity:.8;
        }
        .school i:first-child{transform:rotate(-2deg);}
        .school i:last-child{transform:rotate(2deg);}
        .school-en{
            margin-top:10px;
            font-family:"Comic Sans MS",cursive;
            font-size:10px;letter-spacing:3px;
            color:rgba(61,90,128,.6);text-transform:uppercase;
        }

        /* ===== 主区域：学号 + 姓名 ===== */
        .main{
            display:flex;align-items:center;justify-content:center;gap:34px;
            margin:44px 0 18px;
        }
        .badge{ /* 学号印章 */
            display:inline-block;
            padding:12px 18px 10px;
            border:2.5px solid var(--red);
            border-radius:16px 5px 18px 6px/6px 18px 5px 16px;
            color:var(--red);
            transform:rotate(-6deg);
            position:relative;
            box-shadow:2px 3px 0 rgba(176,58,46,.22);
        }
        .badge::after{
            content:"";position:absolute;inset:4px;
            border:1.3px dashed rgba(176,58,46,.55);
            border-radius:12px 4px 14px 5px/5px 14px 4px 12px;
        }
        .badge-label{display:block;font-size:13px;letter-spacing:4px;}
        .badge .num{
            display:block;font-size:36px;font-weight:bold;line-height:1.15;
            font-family:"Comic Sans MS","Kaiti SC",cursive;
        }
        .name{
            position:relative;
            font-size:92px;line-height:1;
            letter-spacing:6px;
            color:var(--ink);
        }
        .sparkle{
            position:absolute;color:var(--red);
            font-family:"Comic Sans MS",cursive;font-weight:bold;
            animation:twinkle 2.4s ease-in-out infinite;
        }
        .s1{top:-18px;right:-26px;font-size:24px;transform:rotate(12deg);}
        .s2{bottom:6px;left:-30px;font-size:16px;color:var(--blue);animation-delay:1.2s;transform:rotate(-14deg);}
        @keyframes twinkle{
            0%,100%{opacity:.25;}
            50%{opacity:1;}
        }

        /* 波浪分隔线 */
        .wave{display:block;margin:0 auto;}

        .note{
            margin-top:22px;
            font-size:13px;letter-spacing:4px;
            color:var(--blue);
        }

        /* ===== 考拉涂鸦 ===== */
        .koala-big{
            position:absolute;right:-30px;bottom:-36px;width:172px;
            animation:bob 4.5s ease-in-out infinite;
        }
        @keyframes bob{
            0%,100%{transform:translateY(0) rotate(2deg);}
            50%{transform:translateY(-9px) rotate(3.5deg);}
        }
        .koala-mini{
            position:absolute;left:26px;top:24px;width:66px;
            transform:rotate(-10deg);
        }
        .leaf{
            position:absolute;left:-18px;bottom:52px;width:64px;
            transform:rotate(14deg);opacity:.85;
        }

        @media (max-width:520px){
            .card{padding:50px 26px 92px;}
            .school{font-size:20px;letter-spacing:5px;text-indent:5px;}
            .school i{width:26px;}
            .name{font-size:58px;letter-spacing:4px;}
            .badge .num{font-size:28px;}
            .main{gap:20px;margin:36px 0 14px;}
            .koala-big{width:124px;right:-14px;bottom:-26px;}
            .koala-mini{width:50px;left:16px;top:18px;}
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="tape tape-l"></span>
        <span class="tape tape-r"></span>

        <!-- 考拉简笔涂鸦：左上小考拉 -->
        <svg class="koala-mini" viewBox="0 0 110 90" fill="none" aria-hidden="true">
            <g stroke="#33455e" stroke-width="2.6" stroke-linecap="round">
                <circle cx="30" cy="26" r="15"/>
                <circle cx="80" cy="26" r="15"/>
                <ellipse cx="55" cy="50" rx="33" ry="27"/>
                <path d="M38 44 q5 -5 10 0"/>
                <path d="M62 44 q5 -5 10 0"/>
            </g>
            <ellipse cx="55" cy="53" rx="7" ry="10" fill="#33455e"/>
        </svg>

        <header>
            <div class="school"><i></i>大连东软信息学院<i></i></div>
            <p class="school-en">Dalian Neusoft University of Information</p>
        </header>

        <div class="main">
            <div class="badge">
                <span class="badge-label">学号 NO.</span>
                <span class="num">932</span>
            </div>
            <div class="name">
                唐笑
                <span class="sparkle s1">+</span>
                <span class="sparkle s2">+</span>
            </div>
        </div>

        <svg class="wave" width="264" height="14" viewBox="0 0 264 14" fill="none" aria-hidden="true">
            <path d="M2 8 q13 -9 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0"
                  stroke="#b03a2e" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

        <p class="note">· 学 生 手 绘 名 片 ·</p>

        <!-- 桉树叶枝条 -->
        <svg class="leaf" viewBox="0 0 90 120" fill="none" stroke="#3d5a80" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M20 116 q30 -60 50 -108"/>
            <ellipse cx="70" cy="14" rx="6" ry="10" transform="rotate(40 70 14)"/>
            <ellipse cx="44" cy="48" rx="6" ry="10" transform="rotate(65 44 48)"/>
            <ellipse cx="58" cy="82" rx="6" ry="10" transform="rotate(50 58 82)"/>
            <ellipse cx="34" cy="98" rx="5" ry="9" transform="rotate(80 34 98)"/>
        </svg>

        <!-- 大考拉涂鸦 -->
        <svg class="koala-big" viewBox="0 0 240 250" fill="none" aria-hidden="true">
            <!-- 重影速写线 -->
            <g stroke="#33455e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
               transform="translate(3 -2) rotate(1 120 125)" opacity=".25">
                <circle cx="58" cy="66" r="30"/>
                <circle cx="182" cy="66" r="30"/>
                <ellipse cx="120" cy="96" rx="66" ry="56"/>
                <ellipse cx="120" cy="200" rx="44" ry="36"/>
            </g>
            <g stroke="#33455e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <!-- 耳朵 -->
                <circle cx="58" cy="66" r="30"/>
                <path d="M47 56 q-6 12 5 18"/>
                <circle cx="182" cy="66" r="30"/>
                <path d="M193 56 q6 12 -5 18"/>
                <!-- 头 -->
                <ellipse cx="120" cy="96" rx="66" ry="56"/>
                <!-- 眯眯眼 -->
                <path d="M88 88 q7 -7 14 0"/>
                <path d="M138 88 q7 -7 14 0"/>
                <!-- 嘴 -->
                <path d="M108 146 q12 9 24 0"/>
                <!-- 身体 / 手手 / 脚脚 -->
                <ellipse cx="120" cy="200" rx="44" ry="36"/>
                <path d="M82 192 q16 16 34 10"/>
                <path d="M158 192 q-16 16 -34 10"/>
                <path d="M100 234 q8 6 16 0"/>
                <path d="M124 234 q8 6 16 0"/>
            </g>
            <!-- 鼻子 -->
            <ellipse cx="120" cy="112" rx="15" ry="21" fill="#33455e"/>
            <!-- 复古红点缀：腮红 + 星星 -->
            <g stroke="#b03a2e" stroke-width="2.4" stroke-linecap="round">
                <path d="M74 106 q-3 6 3 9"/>
                <path d="M166 106 q3 6 -3 9"/>
                <path d="M28 26 v10 M23 31 h10"/>
                <path d="M214 120 v9 M209.5 124.5 h9"/>
            </g>
            <!-- 手里的桉树枝 -->
            <g stroke="#3d5a80" stroke-width="2.4" stroke-linecap="round" fill="none">
                <path d="M204 44 q16 -20 30 -26"/>
                <ellipse cx="234" cy="18" rx="6" ry="9" transform="rotate(38 234 18)"/>
                <ellipse cx="226" cy="38" rx="5" ry="8" transform="rotate(-24 226 38)"/>
            </g>
        </svg>
    </div>
</body>
</html>
