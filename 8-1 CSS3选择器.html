<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3</title>
    <style>
        .main{
            display:flex;
            flex-wrap:wrap ;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border:1px solid #ccc;
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.5s;
            box-sizing: border-box;
        }
        /*鼠标在偶数盒子上时自定义美化效果（作为基础hover样式，放在特定规则前，让特定规则的同名属性覆盖、额外属性叠加）*/
        .box:nth-child(even):hover{
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #a18cd1 100%);
            border-radius: 20px;
            border: 2px solid #fff;
            color: #fff;
            font-size: 60px;
            box-shadow: 0 8px 20px rgba(162, 140, 209, 0.6);
            transform: translateY(-8px) scale(1.05);
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
        }
        .box:first-child:hover{
            background-color:red ;
            color: white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 10px;
         }
         .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
         }
         .box:nth-of-type(4):hover{
            text-shadow:100px 10px 10px  #4709e4;
         }
         .box:nth-of-type(5):hover{
            /*线性渐变*/
            background: linear-gradient(to right, red,blue);
         }
          .box:nth-of-type(5)+.box{
            background: radial-gradient(#fff,#ccc,#000);
          }
          /*相邻兄弟选择器
          +后面一个兄弟
          ——就是后面所有兄弟*/
          .box:nth-child(7):hover{
            transform: scale(0.5)/*小于1缩小，大于1放大*/
          }
          .box:nth-child(8):hover{
            transform: translateX(-150px);
          }
          .box:nth-child(9):hover{
            transform: rotateZ(-188deg);
          }
           .box:nth-child(10):hover{
            transform: skewX(20deg) translateY(50px);
          }
          .box:nth-last-child(2):hover::before{
            /*beofore内部最前面的元素*/
            content:'*';
            color: #4709e4;
          }
          /*拓展：第12个盒子，鼠标放在上面时显示自己的名字，要求名字深色背景白色文字，水平垂直居中*/
          .box:last-child:hover{
            background-color: #02000f;   /*深色背景*/
            color: #97b7e6;                /*白色文字*/
            font-size: 0;               /*隐藏原本的数字12*/
          }
          .box:last-child:hover::after{
            content: '唐笑';             /*显示自己的名字*/
            font-size: 32px;            /*恢复字号，名字居中显示（继承父级flex居中）*/
            letter-spacing: 4px;
          }
          .box:nth-child(3n):hover{
            border: 3px solid rgb(234, 41, 147);
          }
          /*偶数even，奇数 odd*/
          /*鼠标在偶数盒子上时自定义效果*/
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
